[package]
name = "opencode2zcode"
version = "0.3.1"
edition = "2021"
rust-version = "1.80"
description = "把 OpenCode Zen 的匿名免费模型接进 ZCode"
license = "MIT"

[[bin]]
name = "opencode2zcode"
path = "src/main.rs"

[dependencies]
# 只挑真正需要的：TLS 走 rustls（免 OpenSSL，Windows 上不用装构建工具）
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "gzip",
    "system-proxy",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tiny_http = "0.12"
winreg = "0.56.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
